animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    animation = global, 1, 10, default
    animation = fadeIn, 1, 4, almostLinear
    animation = fadeOut, 1, 3, almostLinear
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    # path = ~/.config/hypr/wallpapers/carro-de-anime-na-cidade.jpg
    blur_passes = 3
    blur_size = 3
    contrast = 1.0
    brightness = 0.6
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    hide_cursor = true
}

# === SONG === #

label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/current_song)"
    shadow_passes = 0
    font_size = 12
    position = 0, -185
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 256, 48
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.5 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(00000000)
    inner_color = rgba(255, 255, 255, 0.2)
    fade_on_empty = true
    font_family = Iosevka Nerd Font
    placeholder_text = ... #text for input password
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.2
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    font_size = 14
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
}

# USER
label {
    monitor =
    text = cmd[update:1000] echo "$USER"
    font_size = 16
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
}

# PICTURE
image {
  path = ~/.config/hypr/USER.png
  size = 180
  position = 0, 75
  halign = center
  valign = center
  border_size = 3
  rounding = -1
  border_color = rgba(0, 0, 0, 0.1)
  shadow_passes = 1
  shadow_size = 3
}
