#source=~/.config/hypr/matugen_colors.conf

$fileManager = thunar
$mainMod = SUPER
$terminal = kitty

#monitor = DP-3, modeline 421.20 1920 1968 2000 2080 1080 1083 1088 1178 +HSync +VSync, auto, 1, vrr, 1
#monitor = HDMI-A-1, 1920x1080@60,0x1080,1
monitor = , preferred, auto, 1
monitor = DP-2, 1920x1080@240, auto, 1, vrr, 1,bitdepth, 10,cm, dcip3

#exec-once = hyprlock -c ~/.config/hypr/hyprlock_boot.conf
exec-once = ~/.config/hypr/scripts/wl-random-wallpaper-matugen.sh
exec-once = /home/jveju/Thermalright-PhantomSpirit120-Controller-main/.venv/bin/python /home/jveju/Thermalright-PhantomSpirit120-Controller-main/src/controller.py /home/jveju/Thermalright-PhantomSpirit120-Controller-main/config.json
#exec-once = ~/.config/hypr/scripts/wl-random-wallpaper.sh
exec-once = hyprpm reload
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = kwalletd6
exec-once = ~/.config/hypr/scripts/xdg-start.sh
exec-once = waybar
exec-once = swaync
exec-once = openrgb --startminimized

#exec-once = clipse -listen
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

exec-once = systemctl --user start hyprpolkitagent
exec-once = udiskie
exec-once = [workspace 2 silent] steam -silent %U #+open steam://open/minigameslist 
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Ice
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = hypridle
#exec-once = nm-applet --indicator

env = __GL_VRR_ALLOWED, 1
env = HYPRCURSOR_THEME, Bibata-Modern-Ice
env = HYPRCURSOR_SIZE, 24
env = MOZ_DISABLE_RDD_SANDBOX, 1
env = EGL_PLATFORM, wayland

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1

env = GDK_SCALE, 1
env = GDK_BACKEND, wayland, x11, *
env = SDL_VIDEODRIVER, wayland,x11,windows

env = CLUTTER_BACKEND, wayland
env = XCURSOR_SIZE, 24
env = APPIMAGELAUNCHER_DISABLE, 1
env = OZONE_PLATFORM, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = ELECTRON_ENABLE_WAYLAND, 1

bind = $mainMod, C, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen, 0
bind = $mainMod Shift, F, fullscreen, 1
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, workspaceopt, allfloat
bind = $mainMod, P, pseudo, 
bind = $mainMod, R, layoutmsg, togglesplit 
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, D, exec, steam steam://open/friends
bind = $mainMod, S, exec, steam
bind = $mainMod SHIFT, R, exec, bash $HOME/.config/hypr/scripts/waybar-screen-recorder.sh
bind = , PRINT, exec, hyprshot -m region --clipboard-only
#bind = , PRINT, exec, hyprshot -m region --raw | satty --filename - --output-filename ~/Pictures/Screenshots/screenshot-%Y%m%d-%H%M%S.png --init-tool brush --copy-command wl-copy
#bind = $mainMod, V, exec, kitty --class clipse -e 'clipse'
bind = $mainMod, V, exec, cliphist list | rofi -theme ~/.config/rofi/launchernovo/themes/pywal-theme-cliphist.rasi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, RETURN, exec, rofi -show drun -theme ~/.config/rofi/launchernovo/themes/pywal-theme.rasi
bind = $mainMod, escape, exec, missioncenter
bind = $mainMod, f1, exec, $HOME/.config/hypr/scripts/game_perf.sh
bind = $mainMod SHIFT, W, exec, pkill waybar || waybar &
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/hypr/scripts/vol_change.sh
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/hypr/scripts/vol_change.sh
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/vol_change.sh
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down
binde = SHIFT, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/brightness.sh up
binde = SHIFT, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/brightness.sh down
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, TAB, hyprexpo:expo, toggle # can be: toggle, off/disable or on/enable
bind = $mainMod, W, hyprexpo:expo, toggle # can be: toggle, off/disable or on/enable
plugin {
    hyprexpo {
        columns = 2
        gap_size = 10
        bg_col = rgb(111111)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1
        gesture_distance = 300 # how far is the "max"
    }
}

windowrule = suppress_event activatefocus, match:class ^(steam)$
windowrule = immediate on, match:class ^(cs2)$
windowrule = float on, match:class ^(com.saivert.pwvucontrol)
windowrule = size 800 600, match:class com.saivert.pwvucontrol
windowrule = move 1100 70, match:class com.saivert.pwvucontrol
windowrule = animation slide top,match:class com.saivert.pwvucontrol
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)
windowrule = size 800 600, match:class org.pulseaudio.pavucontrol
windowrule = move 1100 70, match:class org.pulseaudio.pavucontrol
windowrule = animation slide top,match:class org.pulseaudio.pavucontrol
windowrule = opacity 0.7 0.7 0.7, match:class ^(kitty)$
//windowrule = opacity 0.7 0.89, match:class ^(vesktop)$
windowrule = opacity 0.89 0.89, match:class ^(com.saivert.pwvucontrol)$
windowrule = opacity 0.7 0.7, match:class ^(org.pulseaudio.pavucontrol)$
//windowrule = opacity 0.79 0.8, match:class ^(thunar)$
windowrule = no_screen_share on,match:class ^(zen)$,match:title ^(\([0-99]+\) )?WhatsApp — Zen Browser$
windowrule = xray off, match:namespace kitty

$center-float-large = class:^(center-float-large)$
windowrule {
name = float-large
float = on
size = (monitor_w*0.7) (monitor_h*0.7)
center = 1
match:class = $center-float-large
}

$center-float = class:^(center-float)$
$center-float-title = title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Delete File.*|.*Confirm File Delete.*|.*Save Image.*|.*Save As.*|.*Open As.*)$
windowrule {
name = float-medium
float = on
size = (monitor_w*0.5) (monitor_h*0.5)
center = 1
match:class = $center-float|$center-float-title
}

$center-float-mini = class:^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrule {
name = float-mini
float = on
size = (monitor_w*0.3) (monitor_h*0.4)
center = 1
match:class = $center-float-mini
}

windowrule {
name = float-misc
float = on
match:class = ^(xfce-polkit|wleave|nwg-look|nm-connection-editor|org.twosheds.iwgtk|overskride|branchdialog)$
}

# Workspaces - Gaming
windowrule {
name = workspace-game-launchers
workspace = 2 silent
match:class = ^([Ss]team)$|(.*heroic.*)$
}

windowrule {
name = workspace-emulators
workspace = 2
match:class = ^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$
}

# Workspaces - Media
windowrule {
name = workspace-music
workspace = 2 silent
match:class = ^(.*[Ss]potify.*)$|(.*high-tide.*)$|(.*You[Tt]ube Music.*)$
}

windowrule {
name = workspace-chat
workspace = 2 silent
match:class = ^(.*discord.*)$|(.*vesktop.*)$|(.*stoat-desktop.*)$|(.*[Tt]elegram.*)$|(.*abaddon.*)$
}

# Idle Inhibit
windowrule {
name = idle-prevent-games
idle_inhibit = always
immediate = on
match:class = ^(.*steam_app.*)$
}

layerrule {
name = layer-overlays-fade
animation = fade
match:namespace = swayosd|selection|hyprlock
}

layerrule = xray on, match:namespace ^(com.saivert.pwvucontrol)$
layerrule = animation slide top,match:namespace waybar
layerrule = blur on, match:namespace com.saivert.pwvucontrol
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = animation slide, match:namespace rofi
layerrule = xray off, match:namespace rofi
layerrule = animation slide top, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0.21, match:namespace swaync-control-center
layerrule = animation slide top, match:namespace swaync-control-center
layerrule = blur on, match:namespace waybar
layerrule = xray off, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = no_screen_share on,match:namespace swaync-notification-window

xwayland {
    force_zero_scaling = true
}

render {
    cm_enabled = true
    #cm_fs_passthrough = 2
    direct_scanout = 0
}

cursor {
    no_hardware_cursors = 2
    no_break_fs_vrr = 1
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 0
    col.active_border = rgba(595959aa) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 17
    rounding_power = 4.0
    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = false
        range = 30
        render_power = 3
        color = 0x66000000
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vfr = true
    vrr = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    initial_workspace_tracking = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    focus_on_activate = true
    enable_swallow = true
    swallow_regex = ^(Alacritty|kitty|footclient|foot)$
    font_family = Noto Fonts
}

input {
    kb_layout = us, br
    kb_variant = 
    kb_model = 
    kb_options = grp:alt_space_toggle
    kb_rules = 
    numlock_by_default = true
    mouse_refocus = false
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
    follow_mouse = 1
    force_no_accel = false

    touchpad {
        natural_scroll = false
        middle_button_emulation = false
        clickfinger_behavior = false
        disable_while_typing = true
        scroll_factor = 1.0
    }
}
