$fileManager = thunar
$mainMod = SUPER
$menu = rofi --show drun
$terminal = kitty

monitor = DP-2, modeline 421.20 1920 1968 2000 2080 1080 1083 1088 1178 +HSync +VSync, auto, 1, vrr, 1
monitor = , preferred, auto, 1
env = GDK_SCALE, 2
env = XCURSOR_SIZE, 3
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kwalletd6
exec-once = ~/.config/hypr/scripts/xdg-start.sh
exec-once = waybar
exec-once = swaync
exec-once = clipse -listen
exec-once = ~/.config/hypr/scripts/wl-random-wallpaper.sh
exec-once = systemctl --user start hyprpolkitagent
exec-once = udiskie
exec-once = [workspace 2 silent]steam -silent %U
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Ice
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = hypridle
exec-once = nm-applet --indicator
env = __GL_VRR_ALLOWED, 1
env = HYPRCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = MOZ_DISABLE_RDD_SANDBOX, 1
env = EGL_PLATFORM, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = GDK_SCALE, 1
env = GDK_BACKEND, wayland, x11, *
env = CLUTTER_BACKEND, wayland
env = XCURSOR_SIZE, 24
env = APPIMAGELAUNCHER_DISABLE, 1
env = OZONE_PLATFORM, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = ELECTRON_ENABLE_WAYLAND, 1
bind = $mainMod, C, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, workspaceopt, allfloat
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, togglesplit, 
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, D, exec, vesktop
bind = CTRL ALT, P, exec, hyprfreeze -a
bind = , PRINT, exec, hyprshot -m output --clipboard-only
bind = SUPER, V, exec, kitty --class clipse -e 'clipse'
bind = $mainMod, RETURN, exec, rofi -show drun -theme ~/.config/rofi/launchernovo/themes/pywal-theme.rasi
bind = $mainMod, escape, exec, missioncenter
bind = SUPER SHIFT, W, exec, pkill waybar && waybar &
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/hypr/scripts/vol_change.sh
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/hypr/scripts/vol_change.sh
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/vol_change.sh
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
windowrule = immediate on, match:class ^(cs2)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)
windowrule = size 800 500, match:class org.pulseaudio.pavucontrol
windowrule = opacity 0.7 0.7, match:class ^(kitty)$
windowrule = opacity 0.9 0.8, match:class ^(vesktop)$
windowrule = float on, match:class (clipse)
windowrule = size 675 652, match:class (clipse)
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
#layerrule = xray on, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = animation slide, match:namespace rofi
layerrule = animation slide, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-notification-window
#layerrule = xray on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
#layerrule = xray on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = blur on, match:namespace waybar
#layerrule = xray on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar

xwayland {
    force_zero_scaling = true
}

cursor {
    no_break_fs_vrr = 1
}

general {
    gaps_in = 7
    gaps_out = 20
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 20
    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = 0x66000000
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vfr = 1
    vrr = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    initial_workspace_tracking = 1
}

input {
    kb_layout = us, br
    kb_variant = 
    kb_model = 
    kb_options = grp:alt_space_toggle
    kb_rules = 
    numlock_by_default = true
    mouse_refocus = false
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
    follow_mouse = 1
    force_no_accel = false

    touchpad {
        natural_scroll = false
        middle_button_emulation = false
        clickfinger_behavior = false
        disable_while_typing = true
        scroll_factor = 1.0
    }
}
